<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GUID Tool</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --success: #16a34a;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f8fafc;
          --surface: #ffffff;
          --surface-border: #cbd5e1;
          --text: #0f172a;
          --muted: #475569;
          --primary: #1d4ed8;
          --primary-hover: #1e40af;
          --success: #15803d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }

      main {
        width: min(100%, 38rem);
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 1rem;
        padding: 1rem;
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.2);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
      }

      #guidContainer {
        width: 100%;
        border: 1px solid var(--surface-border);
        border-radius: 0.75rem;
        background: transparent;
        color: var(--text);
        font-size: clamp(1rem, 2.6vw, 1.2rem);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        padding: 0.75rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 0.9rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        cursor: pointer;
        transition: background 0.2s ease, transform 0.08s ease;
      }

      button:hover {
        background: var(--primary-hover);
      }

      button:active {
        transform: scale(0.98);
      }

      button.success {
        background: var(--success);
      }

      #status {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        min-height: 1.4rem;
      }

      .spin {
        display: inline-block;
        animation: spin 0.5s linear;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      const COPY_FEEDBACK_DURATION = 2000;
      const REFRESH_FEEDBACK_DURATION = 500;
      let copyRevertTimer;

      function uuidv4() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
          var r = (Math.random() * 16) | 0;
          var v = c === "x" ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      }

      function setStatus(message) {
        document.getElementById("status").textContent = message;
      }

      function revertCopyButton() {
        var copyButton = document.getElementById("copyButton");
        copyButton.classList.remove("success");
        copyButton.textContent = "📋 Copy";
      }

      function getGuid() {
        var container = document.getElementById("guidContainer");
        var refreshButton = document.getElementById("refreshButton");
        container.value = uuidv4();
        refreshButton.textContent = "↻ Refresh";
        // Trigger reflow by reading offsetWidth to restart CSS animation on consecutive clicks.
        refreshButton.offsetWidth;
        refreshButton.textContent = "↻ Refresh";
        refreshButton.classList.add("spin");
        setTimeout(function () {
          refreshButton.classList.remove("spin");
        }, REFRESH_FEEDBACK_DURATION);
        setStatus("Generated a new GUID.");
      }

      async function copyGuid() {
        var container = document.getElementById("guidContainer");
        var copyButton = document.getElementById("copyButton");
        var successful = false;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(container.value);
            successful = true;
          } catch (err) {
            successful = false;
          }
        }

        if (!successful) {
          container.select();
          container.setSelectionRange(0, container.value.length);
          try {
            successful = document.execCommand("copy");
          } catch (err) {
            successful = false;
          }
        }

        if (successful) {
          copyButton.classList.add("success");
          copyButton.textContent = "✓ Copied";
          clearTimeout(copyRevertTimer);
          copyRevertTimer = setTimeout(revertCopyButton, COPY_FEEDBACK_DURATION);
          setStatus("GUID copied to clipboard.");
        } else {
          setStatus("Unable to copy automatically. Select and copy manually.");
        }
      }

      window.onload = function () {
        document.getElementById("copyButton").addEventListener("click", function () {
          copyGuid();
        });
        document.getElementById("refreshButton").addEventListener("click", function () {
          getGuid();
        });

        getGuid();
        copyGuid();
      };
    </script>
  </head>
  <body>
    <main>
      <h1>GUID Tool</h1>
      <input id="guidContainer" type="text" readonly aria-label="Generated GUID" />
      <div class="actions">
        <button id="copyButton" type="button">📋 Copy</button>
        <button id="refreshButton" type="button">↻ Refresh</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
